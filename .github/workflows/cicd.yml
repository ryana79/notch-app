name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Build NotchPro
    runs-on: macos-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Prepare broker credentials for CI
      run: cp NotchPro/Resources/BrokerCredentials.example.plist NotchPro/Resources/BrokerCredentials.plist

    - name: Select Xcode
      run: |
        set -euo pipefail
        # macos-latest now ships Xcode 26.x (not 16.x). Prefer an explicit
        # version when present, otherwise fall back to the runner default.
        CANDIDATES=(
          "/Applications/Xcode_26.5.app"
          "/Applications/Xcode_26.4.1.app"
          "/Applications/Xcode_26.4.app"
          "/Applications/Xcode.app"
        )
        XCODE_PATH=""
        for candidate in "${CANDIDATES[@]}"; do
          if [[ -d "$candidate" ]]; then
            XCODE_PATH="$candidate"
            break
          fi
        done
        if [[ -z "$XCODE_PATH" ]]; then
          XCODE_PATH="$(ls -1d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
        fi
        if [[ -z "$XCODE_PATH" || ! -d "$XCODE_PATH" ]]; then
          echo "::error::No Xcode installation found under /Applications"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          exit 1
        fi
        echo "Using $XCODE_PATH"
        sudo xcode-select -s "$XCODE_PATH"
        xcodebuild -version

    - name: Resolve Swift packages
      run: xcodebuild -resolvePackageDependencies -project NotchPro.xcodeproj

    - name: Build Release
      run: |
        set -euo pipefail
        xcodebuild \
          -project NotchPro.xcodeproj \
          -scheme NotchPro \
          -configuration Release \
          -destination "generic/platform=macOS" \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build
